name: macos

# The whole app on Apple Silicon. macOS minutes cost about ten times Linux minutes on a
# private repository, so this runs only for pull requests and main, only when app code
# changes, and a newer push cancels the run in progress.

on:
  pull_request:
    paths:
      - "Packages/**"
      - "App/**"
      - "scripts/bundle.sh"
      - "scripts/fetch-fonts.sh"
      - "Makefile"
      - ".github/workflows/macos.yml"
  push:
    branches: [main]
    paths:
      - "Packages/**"
      - "App/**"
      - "scripts/bundle.sh"
      - "scripts/fetch-fonts.sh"
      - "Makefile"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: build, test, bundle, smoke test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - uses: actions/cache@v4
        with:
          path: Packages/DeathRaceKit/.build
          key: spm-macos-26-${{ hashFiles('Packages/DeathRaceKit/Package.swift') }}-${{ github.sha }}
          restore-keys: spm-macos-26-${{ hashFiles('Packages/DeathRaceKit/Package.swift') }}-
      # The fonts the app ships: fetched by a pinned script, kept between runs.
      - uses: actions/cache@v4
        with:
          path: build/fonts-cache
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}
      - name: Fetch the fonts
        timeout-minutes: 5
        run: scripts/fetch-fonts.sh
      # Step limits keep a hang from spending the whole job's macOS minutes.
      - name: Build
        timeout-minutes: 15
        run: swift build --package-path Packages/DeathRaceKit --build-tests
      - name: Smoke test the pseudo-terminal outside the test runner
        timeout-minutes: 2
        run: swift run --package-path Packages/DeathRaceKit --skip-build vthost smoke --verbose
      # swift-testing ends its run with a summary line. A test process that exits early,
      # midway through a test, can still exit 0, so the summary is required too. The window
      # tests drive AppKit and go first, on their own, so the rest report even if they stop.
      - name: Test the windows
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p build
          swift test --package-path Packages/DeathRaceKit --skip-build --filter DeathRaceAppTests 2>&1 \
            | tee build/window-tests.log
          grep -q "Test run with .* passed" build/window-tests.log \
            || { echo "::error::The window tests ended without their summary: the test process exited early."; exit 1; }
      - name: Test
        timeout-minutes: 10
        run: |
          set -o pipefail
          swift test --package-path Packages/DeathRaceKit --skip-build --skip DeathRaceAppTests 2>&1 | tee build/tests.log
          grep -q "Test run with .* passed" build/tests.log \
            || { echo "::error::The tests ended without their summary: the test process exited early."; exit 1; }
      - name: What the system logged about the tests
        if: failure()
        run: |
          log show --last 10m --style compact \
            --predicate 'process CONTAINS "swiftpm-testing-helper" OR process CONTAINS "xctest" OR process CONTAINS "PackageTests"' \
            | grep -v "^Filtering" | tail -150 || true
          # A crash leaves a report even when the test runner says nothing.
          for report in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -2); do
            echo "== $report"
            head -c 12000 "$report"
            echo
          done
      # The recorded programs' screens drawn by the GPU, kept as an artifact for review.
      - name: Render the corpus screens
        timeout-minutes: 3
        run: DEATHRACE_RENDER_PREVIEW="$PWD/build/render" swift test --package-path Packages/DeathRaceKit --skip-build --filter RenderGoldenTests
      # The Pit Lane in all eight themes, with Hear Me Calling and Settings, kept for review
      # beside the mockups; a debug build's own flag, so it needs no bundle.
      - name: Render the chrome
        timeout-minutes: 3
        run: Packages/DeathRaceKit/.build/debug/DeathRace --render-chrome build/chrome
      # With the legendsd spike's helper and agent, so the signature check covers nested code.
      - name: Bundle
        timeout-minutes: 10
        run: SPIKE=1 CONFIG=debug scripts/bundle.sh
      # A shell, a session, CoreText glyphs and, where the runner has a Metal device, an
      # offscreen render whose pixels are checked; the frame is kept as an artifact.
      - name: Smoke test the bundled app
        timeout-minutes: 2
        run: '"build/Death Race for Code.app/Contents/MacOS/DeathRace" --smoke-test --write-frame build/smoke-frame.png'
      - name: Verify the signature
        run: codesign --verify --strict --verbose=2 "build/Death Race for Code.app"
      - name: Zip the app
        run: ditto -c -k --keepParent "build/Death Race for Code.app" build/DeathRace.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DeathRace-${{ github.sha }}
          path: build/DeathRace.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-frame-${{ github.sha }}
          path: build/smoke-frame.png
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: app-icon-${{ github.sha }}
          path: build/icon/AppIcon.iconset
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: render-preview-${{ github.sha }}
          path: build/render
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-preview-${{ github.sha }}
          path: build/chrome
          if-no-files-found: ignore
          retention-days: 7
