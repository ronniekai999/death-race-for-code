name: linux

# The portable half (CPTY, PTYKit, VTCore, ScreenProtocol, SessionKit, vthost) on the
# swift.org toolchain that matches the Swift in Xcode 26.6. Cheap enough to run on every
# pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
    steps:
      - uses: actions/checkout@v5
      - name: Tools the image may lack
        run: |
          missing=""
          for tool in make python3; do command -v $tool >/dev/null || missing="$missing $tool"; done
          if [ -n "$missing" ]; then apt-get update -qq && apt-get install -y -qq $missing; fi
      - name: Build
        run: swift build --package-path Packages/DeathRaceKit --build-tests
      - name: Test
        run: swift test --package-path Packages/DeathRaceKit --skip-build
      - name: Lint
        run: make lint
      - name: vthost smoke test
        run: swift run --package-path Packages/DeathRaceKit vthost smoke
      # xterm's conformance suite, with vthost as the terminal. A ratchet: new failures and
      # unexpected passes both fail the build (see docs/CONFORMANCE.md).
      - name: esctest
        run: |
          scripts/esctest.sh
      # A minute of libFuzzer: the engine must not crash, and every delta must reproduce the
      # screen through the codec. nightly.yml fuzzes for half an hour.
      - name: Fuzz for a minute
        run: |
          make fuzz FUZZ_SECONDS=60
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: Tools/VTFuzz/.build/artifacts/
          retention-days: 14
      # Session threads are the one place threads meet; check them for data races.
      - name: Test under Thread Sanitizer
        run: >-
          swift test --package-path Packages/DeathRaceKit --sanitize=thread
          --scratch-path Packages/DeathRaceKit/.build/tsan

  # Temporary, for M4: the font releases to pin. The sandbox the code is written in cannot
  # reach GitHub's release downloads, so this prints what scripts/fetch-fonts.sh will pin:
  # each archive's address, SHA-256 and the paths inside it.
  font-sources:
    name: font sources (temporary)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Releases, archives, hashes and contents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, urllib.request, zipfile
          def get(url, token=True):
              headers = {"User-Agent": "death-race-for-code"}
              if token:
                  headers["Authorization"] = "Bearer " + os.environ["GH_TOKEN"]
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers)).read()
          wanted = {
              "githubnext/monaspace": lambda n: n.endswith(".zip") and "monaspace" in n.lower()
                  and "nerd" not in n.lower() and "variable" not in n.lower(),
              "ryanoasis/nerd-fonts": lambda n: n == "NerdFontsSymbolsOnly.zip",
          }
          for repo, pick in wanted.items():
              releases = json.loads(get(f"https://api.github.com/repos/{repo}/releases?per_page=4"))
              print("==", repo)
              for release in releases:
                  print("  release", release["tag_name"], release["published_at"], "prerelease" if release["prerelease"] else "")
                  for asset in release["assets"]:
                      print("     ", asset["name"], asset["size"])
              latest = next(r for r in releases if not r["prerelease"] and not r["draft"])
              for asset in latest["assets"]:
                  if not pick(asset["name"]):
                      continue
                  data = get(asset["browser_download_url"], token=False)
                  print("  pin", latest["tag_name"], asset["browser_download_url"])
                  print("  sha256", hashlib.sha256(data).hexdigest(), len(data), "bytes")
                  with zipfile.ZipFile(io.BytesIO(data)) as archive:
                      for info in archive.infolist():
                          name = info.filename
                          if any(k in name for k in ("Neon", "Radon", "LICENSE", "OFL", "Symbols", "README")):
                              print("    ", info.file_size, name)
          PY
