name: linux

# The portable half (CPTY, PTYKit, VTCore, ScreenProtocol, SessionKit, vthost) on the
# swift.org toolchain that matches the Swift in Xcode 26.6. Cheap enough to run on every
# pull request.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --package-path Packages/DeathRaceKit --build-tests
      - name: Test
        run: swift test --package-path Packages/DeathRaceKit --skip-build
      - name: Lint
        run: >-
          swift format lint --recursive --strict
          Packages/DeathRaceKit/Sources Packages/DeathRaceKit/Tests
          Packages/DeathRaceKit/Tools Packages/DeathRaceKit/Package.swift
      - name: vthost smoke test
        run: swift run --package-path Packages/DeathRaceKit vthost smoke
      # xterm's conformance suite, with vthost as the terminal. A ratchet: new failures and
      # unexpected passes both fail the build (see docs/CONFORMANCE.md).
      - name: esctest
        run: |
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }
          scripts/esctest.sh
      # Session threads are the one place threads meet; check them for data races.
      - name: Test under Thread Sanitizer
        run: >-
          swift test --package-path Packages/DeathRaceKit --sanitize=thread
          --scratch-path Packages/DeathRaceKit/.build/tsan
