name: linux

# The portable half (CPTY, PTYKit, VTCore, ScreenProtocol, SessionKit, ConfigKit, SurfaceCore,
# Vault, SSHKit, AppCore, vthost, deathrace-askpass) on the swift.org toolchain that matches
# the Swift in Xcode 26.6. Cheap enough to run on every pull request. SSHKit's masters,
# tunnels and askpass are tested end to end against a throwaway sshd in the container.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: swift:6.3.3-noble@sha256:cd45c27b3abc42310c33cfaf3008b18156cbdc9187834c9617e8f43a26d2675c
    steps:
      - uses: actions/checkout@v5
      # OpenSSH's client: SSHKit's tests check the config WRLD writes with real `ssh -G`.
      # zsh and fish: the shell integration is tested by running the real shells in a
      # pseudo-terminal, and zsh 5.9 here is the same version macOS ships. bash is in the
      # image already. About ten seconds.
      - name: Tools the image may lack
        run: |
          missing=""
          for tool in make python3 zsh fish; do command -v $tool >/dev/null || missing="$missing $tool"; done
          command -v ssh >/dev/null || missing="$missing openssh-client"
          if [ -n "$missing" ]; then apt-get update -qq && apt-get install -y -qq $missing; fi
      - name: Build
        run: swift build --package-path Packages/DeathRaceKit --build-tests
      # sshd on loopback for SSHKit's end-to-end suite, started in this step only, so the
      # Thread Sanitizer run below leaves that suite out. Sourced from a file rather than
      # eval'd: a failed start stops the step instead of skipping the suite.
      # DEATHRACE_SHELLS asks for the real-shell suite, and only this step sets it, so the
      # sanitizer run below leaves it out — real shells in pseudo-terminals would be slow
      # under TSan and tell it nothing, being separate processes. REQUIRE makes a missing
      # shell fail here rather than quietly skip.
      - name: Test
        env:
          DEATHRACE_REQUIRE_SSH: "1"
          DEATHRACE_SHELLS: "1"
          DEATHRACE_REQUIRE_SHELLS: "1"
        run: |
          scripts/ci-sshd.sh > /tmp/sshd-env
          . /tmp/sshd-env
          swift test --package-path Packages/DeathRaceKit --skip-build
      - name: What sshd saw
        if: failure()
        run: cat /tmp/sshd-wrld.log || true
      - name: Lint
        run: make lint
      - name: vthost smoke test
        run: swift run --package-path Packages/DeathRaceKit vthost smoke
      # xterm's conformance suite, with vthost as the terminal. A ratchet: new failures and
      # unexpected passes both fail the build (see docs/CONFORMANCE.md).
      - name: esctest
        run: |
          scripts/esctest.sh
      # A minute of libFuzzer: the engine must not crash, and every delta must reproduce the
      # screen through the codec. nightly.yml fuzzes for half an hour.
      - name: Fuzz for a minute
        run: |
          make fuzz FUZZ_SECONDS=60
      - name: Keep what the fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: Tools/VTFuzz/.build/artifacts/
          retention-days: 14
      # Session threads are the one place threads meet; check them for data races.
      - name: Test under Thread Sanitizer
        run: >-
          swift test --package-path Packages/DeathRaceKit --sanitize=thread
          --scratch-path Packages/DeathRaceKit/.build/tsan

